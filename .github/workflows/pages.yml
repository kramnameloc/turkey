name: Test and deploy Turkey Takeover

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turkey-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    outputs:
      entry: ${{ steps.verify.outputs.entry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check code, build and verify the production site
        id: verify
        run: npm run check:quick
      - run: npm run browsers:install -- --with-deps
      - name: Run browser tests on the verified build
        id: browser
        run: npm run test:e2e:built
      - name: Save browser failure traces
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package the production site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://turkey.kramnameloc.com/
    steps:
      - name: Deploy verified artifact
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: Verify Pages release and check public link
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /.nvmrc
            /scripts/check-pages.mjs
            /scripts/release-assets.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Confirm the deployed commit and custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages")
          jq -e '.cname == "turkey.kramnameloc.com" and .build_type == "workflow"' <<< "$site"
          deployment=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&sha=$GITHUB_SHA&per_page=1" --jq '.[0].id')
          test -n "$deployment"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses" --jq '.[0].state' | grep -Fx success
          echo "GitHub confirms that \`$GITHUB_SHA\` deployed to the Pages environment for turkey.kramnameloc.com." >> "$GITHUB_STEP_SUMMARY"
      - name: Check the public game and share artwork
        env:
          EXPECTED_ENTRY: ${{ needs.build.outputs.entry }}
        run: |
          for attempt in {1..15}; do
            if node scripts/check-pages.mjs --live; then
              echo "Verified the public HTML for \`$GITHUB_SHA\`, its game bundles and the social card." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            else
              result=$?
            fi
            if [ "$result" -eq 77 ]; then
              echo "::warning::The public edge returned HTTP 403 to this runner. External preview verification is inconclusive."
              echo "The public edge refused this runner (403). The artifact and deployment checks passed; run \`node scripts/check-pages.mjs --live\` from a permitted client to check the public response." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 15 ]; then sleep 12; fi
          done
          exit 1
