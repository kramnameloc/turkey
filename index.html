<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#161915" />
    <meta
      name="description"
      content="Play as a turkey. Dodge flying dinner rolls and track runaway Thanksgiving dishes across eighteen hunts on a six-day trip through Colorado."
    />
    <link rel="canonical" href="https://turkey.kramnameloc.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gobbler Ops" />
    <meta property="og:title" content="Turkey Takeover" />
    <meta
      property="og:description"
      content="Dinner is on the run, and it throws back. Play the Thanksgiving food fight on a six-day Colorado trip."
    />
    <meta property="og:url" content="https://turkey.kramnameloc.com/" />
    <meta
      property="og:image"
      content="https://turkey.kramnameloc.com/social/turkey-takeover-card.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Turkey Takeover. A Bourbon Red turkey chases a runaway slice of pumpkin pie beneath the Colorado Flatirons."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Turkey Takeover" />
    <meta
      name="twitter:description"
      content="A turkey, eighteen hunts, and six days of Thanksgiving food fights."
    />
    <meta
      name="twitter:image"
      content="https://turkey.kramnameloc.com/social/turkey-takeover-card.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Turkey Takeover. A Bourbon Red turkey chases a runaway slice of pumpkin pie beneath the Colorado Flatirons."
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/ui/turkey-favicon.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/social/apple-touch-icon.png"
    />
    <title>Turkey Takeover · Gobbler Ops</title>
  </head>
  <body>
    <main id="lobby">
      <header class="mast">
        <a class="brand" href="#lobby" aria-label="Gobbler Ops hunt lobby"
          ><img src="/src/assets/gobbler-icon.webp" alt="" /><span
            >GOBBLER<span class="brand-light">OPS</span></span
          ></a
        >
        <nav aria-label="Game navigation">
          <button class="nav-item active" data-action="home">Hunt lobby</button>
          <button class="nav-item" data-action="guide">Field guide</button>
          <button class="nav-item" data-action="map">Hunt map</button>
        </nav>
        <div class="tools">
          <button
            class="icon-button"
            data-action="share"
            aria-label="Share game"
            title="Share game"
          >
            <i data-i="share"></i>
          </button>
          <button
            class="icon-button"
            data-action="sound"
            aria-label="Mute audio"
            title="Mute audio"
          >
            <i data-i="volume"></i></button
          ><button
            class="icon-button"
            data-action="fullscreen"
            aria-label="Enter fullscreen"
            title="Enter fullscreen"
          >
            <i data-i="expand"></i>
          </button>
        </div>
      </header>
      <section class="hero" aria-labelledby="title">
        <figure class="menu-poster">
          <h1 id="title">
            <picture>
              <source
                type="image/avif"
                srcset="/src/assets/poster-720.avif 720w, /src/assets/poster-1200.avif 1200w"
                sizes="(max-width: 620px) calc(100vw - 40px), (max-width: 850px) and (orientation: portrait) 90vw, 65vw"
              />
              <img
                class="cover-art"
                src="/social/turkey-takeover-card.jpg"
                alt="Turkey Takeover"
                width="1200"
                height="630"
                fetchpriority="high"
              />
            </picture>
          </h1>
          <figcaption>
            <span>Player breed · Bourbon Red turkey</span>
            <span><i data-i="pin"></i>39.9185° N &nbsp; 105.0688° W</span>
          </figcaption>
        </figure>
        <div class="intro">
          <div class="eyebrow">
            <span class="dash"></span> A THANKSGIVING ROAD TRIP
          </div>
          <h2>Dinner is on the run, and it throws back.</h2>
          <p>
            Chase runaway dishes through three hunts a day, from Denver arrivals to tea in Boulder.
          </p>
          <div class="actions">
            <button class="primary" data-action="start">
              <i data-i="focus"></i>Start trip</button
            ><button class="secondary" data-action="parade">
              <i data-i="flag"></i>Watch parade</button
            ><button class="secondary" data-action="controls">
              <i data-i="controller"></i>How to play
            </button>
          </div>
          <div id="lobby-hud-picker"></div>
        </div>
      </section>
      <section class="intel" aria-label="Hunt information">
        <button class="stat location" data-action="map">
          <span class="stat-icon"><i data-i="map"></i></span
          ><span><small>HUNT ZONE</small><strong>Colorado Front Range</strong></span>
        </button>
        <button class="stat" data-action="itinerary">
          <span class="stat-icon"><i data-i="target"></i></span
          ><span
            ><small>THE OBJECTIVE</small
            ><strong id="lobby-total">18 hunts · 6 days</strong></span
          >
        </button>
        <button class="stat" data-action="timer" aria-label="Hunt timer" aria-pressed="true">
          <span class="stat-icon"><i data-i="clock"></i></span
          ><span><small>HUNT TIMER</small><strong id="lobby-timer">On · 2 min/hunt</strong></span>
        </button>
        <div class="stat best">
          <span class="stat-icon"><i data-i="flag"></i></span
          ><span
            ><small>PERSONAL BEST</small
            ><strong id="best">Unrecorded</strong></span
          >
        </div>
      </section>
      <footer>
        <span class="field-status"><b></b> SINGLE PLAYER</span
        ><button data-action="credits">
          <i data-i="layers"></i> Map &amp; photo credits
        </button>
      </footer>
    </main>
    <section id="arena" hidden aria-label="Turkey capture hunt">
      <canvas
        id="scene"
        tabindex="-1"
        aria-label="Three-dimensional Colorado hunting grounds"
      ></canvas>
      <div id="hit-flash" aria-hidden="true"></div>
      <div class="hud" data-layout="field-kit">
        <div class="hud-mission">
          <div class="hud-objective hud-plate">
            <div class="objective-heading">
              <i data-i="flag"></i><span id="objective-label"></span>
            </div>
            <div class="objective-body">
              <span id="hunt-name" hidden></span>
              <div class="capture-line">
                <strong id="counter"></strong><span id="capture-label">Dishes captured</span>
              </div>
              <div id="progress-pips" aria-hidden="true"></div>
            </div>
          </div>
          <div class="clock-box hud-plate">
            <i data-i="clock"></i>
            <div><small id="clock-label">Supper in</small><strong id="time">5:00</strong></div>
          </div>
        </div>
        <button class="hud-pause hud-plate" data-action="pause" aria-label="Pause hunt" title="Pause (P)">
          <i data-i="pause"></i>
        </button>
        <div class="hud-wayfinding">
          <div class="hud-navigation">
            <button id="compass" class="hud-plate" aria-label="Show navigation arrows to the next dish"
              aria-describedby="bearing" aria-pressed="false" title="Find the next dish (H)">
              <span class="compass-dial" aria-hidden="true"><b id="compass-needle"></b></span>
              <span class="compass-readout"><strong id="bearing">N</strong>
                <span class="compass-find">Find dish <kbd>H</kbd></span>
              </span>
            </button>
            <div id="trail-hint" class="hud-plate" hidden>
              <span class="trail-dial" aria-hidden="true">
                <svg class="trail-needle" viewBox="0 0 32 32">
                  <path d="M16 2 27 27 16 21 5 27Z" fill="currentColor" />
                </svg>
              </span>
              <div><strong></strong><small></small></div>
            </div>
          </div>
          <div class="map-controls">
            <div id="current-street" role="status" aria-label="Current street" hidden>
              <i data-i="pin"></i><span></span>
            </div>
            <button class="radar hud-plate" data-action="map" title="Open hunt map" aria-label="Open hunt map">
              <span class="map-face">
                <canvas id="radar" width="200" height="160"></canvas>
                <span class="map-cardinals" aria-hidden="true"><b>N</b><b>E</b><b>S</b><b>W</b></span>
              </span>
              <span class="map-caption"><i data-i="map"></i> <b id="radar-label">HUNT MAP</b> <kbd>M</kbd></span>
            </button>
            <button id="view-toggle" class="hud-plate" aria-pressed="false" title="Switch camera (V)">
              <i data-i="camera"></i><span id="view-name">First person</span><kbd>V</kbd>
            </button>
          </div>
        </div>
        <div id="crosshair" aria-hidden="true"><b></b></div>
        <div id="in-world-label" hidden></div>
        <div class="hud-prompts">
          <div id="incoming" hidden></div>
          <button id="interact" class="hud-plate" hidden>
            <i data-i="door"></i><span id="interact-name"></span><kbd>G</kbd>
          </button>
        </div>
        <div id="notice" role="status"></div>
        <div class="hud-kit">
          <div id="vitals" class="hud-plate">
            <i data-i="heart"></i><strong id="health-value">100</strong>
            <span id="health-unit">HP</span>
            <progress id="health-meter" aria-label="Health" max="100" value="100"></progress>
          </div>
          <button class="equipment hud-plate" id="weapon-switch" title="Switch capture weapon (R)">
            <i id="gear-icon" aria-hidden="true"></i>
            <span class="gear-line"><strong id="gear-name">Harvest Net</strong><kbd>R</kbd></span>
            <span class="weapon-stats"><span id="weapon-damage">24 DMG</span><b id="net-state">Ready</b></span>
            <small id="switch-hint">Next at 2 captures</small>
          </button>
          <span id="boosts" class="hud-plate" hidden></span>
        </div>
        <div class="touch" id="touch-controls">
          <div id="stick" role="group" aria-label="Movement joystick">
            <b></b>
          </div>
          <button id="touch-flap" aria-label="Flap" title="Tap to jump, hold to glide">
            <i data-i="feather"></i><span>Flap</span></button
          ><button id="touch-fire" aria-label="Cast equipped weapon">
            <i data-i="focus"></i><span>Cast</span>
          </button>
        </div>
      </div>
    </section>
    <dialog id="panel">
      <div class="panel-head">
        <div class="panel-brand">
          <img alt="" src="/src/assets/gobbler-icon.webp" /> GOBBLER OPS
        </div>
        <button
          data-action="close"
          class="icon-button"
          aria-label="Close panel"
        >
          <i data-i="x"></i>
        </button>
      </div>
      <div id="panel-content"></div>
    </dialog>
    <dialog id="share-link" aria-labelledby="share-title">
      <div class="panel-head">
        <div class="panel-brand">
          <img src="/src/assets/gobbler-icon.webp" alt="" /> GOBBLER OPS
        </div>
        <button
          type="button"
          class="icon-button"
          data-action="dismiss-share"
          aria-label="Close share panel"
        >
          <i data-i="x"></i>
        </button>
      </div>
      <img
        class="share-preview"
        src="/social/turkey-takeover-card.jpg"
        alt="Turkey Takeover. A Bourbon Red turkey chases a runaway slice of pumpkin pie beneath the Colorado Flatirons."
        width="1200"
        height="630"
        loading="lazy"
      />
      <div class="share-body">
        <h2 class="panel-title" id="share-title">Share the hunt</h2>
        <label class="travel-label" for="share-url">GAME LINK</label>
        <input
          id="share-url"
          type="url"
          readonly
          value="https://turkey.kramnameloc.com/"
        />
        <button class="primary" data-action="copy-link">Copy link</button
        ><span id="share-status" role="status"></span>
      </div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
